name: Build and Release CI-Deploy APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore (WorkItem 5c928545)
        # Only runs once the repo secret is actually configured; if it's unset
        # this step is skipped and the build below falls back to debug signing
        # (see app/build.gradle.kts) instead of failing.
        if: ${{ secrets.CI_DEPLOY_RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          CI_DEPLOY_RELEASE_KEYSTORE_BASE64: ${{ secrets.CI_DEPLOY_RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$CI_DEPLOY_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ci-deploy-release.jks"
          echo "CI_DEPLOY_RELEASE_STORE_FILE=$RUNNER_TEMP/ci-deploy-release.jks" >> "$GITHUB_ENV"

      - name: Build with Gradle
        env:
          CI_DEPLOY_RELEASE_STORE_PASSWORD: ${{ secrets.CI_DEPLOY_RELEASE_STORE_PASSWORD }}
          CI_DEPLOY_RELEASE_KEY_PASSWORD: ${{ secrets.CI_DEPLOY_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p app/build/outputs/apk/release-pkg
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release-pkg/CI-Deploy_debug.apk

      - name: Create Release and Upload Asset
        # RESUMED 2026-09-16 (WorkItem 5c928545): app/ci-deploy.jks (the old key this build
        # was signed with) was compromised — see CODE_REVIEW_2026-08-11.md CRITICAL-01. CI was
        # paused on 2026-09-15 to stop publishing releases signed with that key while it was
        # rotated. Rotation is now complete: a new keystore was generated, app/build.gradle.kts
        # and this workflow's "Decode release keystore"/"Build with Gradle" steps consume it via
        # env vars, and the owner has added the CI_DEPLOY_RELEASE_STORE_PASSWORD /
        # CI_DEPLOY_RELEASE_KEY_PASSWORD / CI_DEPLOY_RELEASE_KEYSTORE_BASE64 repo secrets under
        # Settings > Secrets and variables > Actions. Gated on the keystore secret being present
        # (rather than an unconditional `if: true`) so this stays paused automatically if the
        # secrets are ever removed or rotated out again.
        if: ${{ secrets.CI_DEPLOY_RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Generate tag and release name based on date and commit SHA
          TAG_NAME="v$(date +'%Y.%m.%d')-${GITHUB_SHA::7}"
          RELEASE_NAME="CI-Deploy Debug Release ($(date +'%Y-%m-%d'))"
          
          # If triggered by tag push, use the pushed tag
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            RELEASE_NAME="CI-Deploy Debug Release $TAG_NAME"
          fi
          
          echo "Creating release $RELEASE_NAME with tag $TAG_NAME"
          
          gh release create "$TAG_NAME" \
            app/build/outputs/apk/release-pkg/CI-Deploy_debug.apk \
            --title "$RELEASE_NAME" \
            --notes "Automated native Android debug build for CI-Deploy. Built from commit $GITHUB_SHA."

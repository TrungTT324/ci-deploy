  "README.md": "# Tài liệu appQa\n\nThư mục này mô tả các tính năng đang có trong module Android `appQa`.\n\nScript Runner hiện có 9 core step được đăng ký trong `ActionRegistry`: `open_app`, `tap`, `home`, `back`, `recents`, `wait`, `clear_recents`, `capture`, `record`. Web Action List lấy danh sách này từ `GET /api/qa/steps`.\n\n## Mục lục\n\n1. [Tổng quan sản phẩm](01-tong-quan.md)\n2. [Cài đặt và khởi động](02-cai-dat-va-khoi-dong.md)\n3. [Accessibility và điều khiển thiết bị](03-accessibility-automation.md)\n4. [Chụp ảnh, quay màn hình và báo cáo](04-media-va-bao-cao.md)\n5. [Web Portal, API và kịch bản JSON](05-web-portal-va-script.md)\n6. [Kiến trúc kỹ thuật](06-kien-truc.md)\n7. [Xử lý sự cố và giới hạn](07-xu-ly-su-co.md)\n8. [Data model của Script](08-script-data-model.md)\n9. [Data model của Action](09-action-data-model.md)\n10. [Mô tả và cách sử dụng Action](10-mo-ta-action.md)\n11. [Action Definitions và source mapping](11-action-definitions.md)\n12. [Cách lấy danh sách step hiện tại](12-lay-danh-sach-step-hien-tai.md)\n\nJSON mẫu: [examples/script-example.json](examples/script-example.json).\nJSON Schema: [examples/script-actions.schema.json](examples/script-actions.schema.json).\n\n## Xem tài liệu trên trình duyệt\n\nCó thể double-click `index.html` để xem trực tiếp bằng trình duyệt, không cần chạy server. Trang chứa một bản fallback của toàn bộ nội dung Markdown để hoạt động với URL `file://`.\n\nKhi đang chỉnh sửa tài liệu và muốn trang luôn đọc phiên bản `.md` mới nhất, chạy một web server tĩnh.\n\nSau khi sửa Markdown, đồng bộ bản fallback dùng cho `file://`:\n\n```bash\nnode appQa/docs/sync-index.mjs\n```\n\nTừ thư mục `appQa/docs`, chạy một web server tĩnh:\n\n```bash\npython3 -m http.server 8090\n```\n\nSau đó mở `http://localhost:8090/`. File `index.html` cung cấp thanh điều hướng, tìm kiếm và render các file Markdown mà không cần thư viện bên ngoài.\n\n## Phạm vi và nguồn tham chiếu\n\nTài liệu được đối chiếu với mã nguồn trong `appQa/src/main`, `appQa/build.gradle.kts` và giao diện web trong `appQa/src/main/assets`. Giá trị port hiện tại trong mã nguồn là **8086**.\n",
  "01-tong-quan.md": "# Tổng quan appQa\n\n## Mục tiêu\n\n`appQa` là công cụ QA Automation chạy native trên Android. Ứng dụng cho phép kỹ sư kiểm thử điều khiển thao tác trên thiết bị, chụp/quay trạng thái màn hình, chạy chuỗi hành động JSON và xem báo cáo từ trình duyệt trong cùng mạng nội bộ.\n\nỨng dụng hỗ trợ Android API 24 trở lên, target API 34 và được viết bằng Kotlin/JVM 17. API 24 là mức tối thiểu vì action gesture dùng `AccessibilityService.dispatchGesture()`.\n\n## Nhóm tính năng chính\n\n### Điều khiển thiết bị bằng Accessibility\n\n- Chạm tại tọa độ màn hình.\n- Vuốt giữa hai tọa độ với thời lượng tùy chỉnh.\n- Điền văn bản vào ô nhập liệu đang focus hoặc ô có thể chỉnh sửa.\n- Gửi hành động hệ thống Back, Home và Recents.\n- Gesture dùng chung implementation trong `BaseAccessibilityGestureService`.\n\n### Floating Control\n\nKhi QA Automation Service chạy, một thanh điều khiển nổi xuất hiện trên ứng dụng khác. Thanh này có thể kéo thả và cung cấp thao tác chụp ảnh, bắt đầu/dừng quay, chạy demo tự động, Back, Home và đóng service.\n\n### Screen Capture và Screen Record\n\n- Chụp ảnh PNG theo đúng kích thước màn hình vật lý.\n- Quay MP4/H.264, 30 fps, bitrate 3 Mbps.\n- Tự ẩn floating control trước khi bắt hình.\n- Lưu một bản cho Web Report và một bản vào Gallery của thiết bị.\n\n### Web Portal và Script Library\n\nWeb server tích hợp cung cấp:\n\n- Dashboard điều khiển tại `http://<device-ip>:8086/`.\n- Thư viện tạo, sửa, xóa và chạy script.\n- Action List hai cột để xem 9 core step, chỉnh input, chạy thử và xem output.\n- API `GET /api/qa/steps` lấy definition động từ `ActionRegistry`.\n- Test Console để mở app, tap và capture/record nhanh.\n- Trang xem ảnh/video báo cáo tại `/reports`.\n\n## Luồng sử dụng tiêu chuẩn\n\n1. Mở `appQa` và bật Accessibility.\n2. Cấp quyền Draw over other apps.\n3. Nhấn Start Service và xác nhận Screen Capture của Android.\n4. Dùng floating control hoặc truy cập Web Portal từ máy tính cùng mạng.\n5. Chạy thao tác kiểm thử.\n6. Xem ảnh/video trong `/reports` hoặc trong Gallery.\n\n## Thành phần ngoài phạm vi\n\n`appQa` không phải framework assertion hoàn chỉnh. Script hiện tại điều phối hành động và thu thập bằng chứng; nó chưa có cú pháp kiểm tra nội dung UI, OCR, selector theo resource ID, retry có điều kiện hoặc kết quả pass/fail theo assertion.\n\nAndroid không cấp cho app thường quyền force-stop ứng dụng khác. Vì vậy registry không cung cấp `stop_all`; action `clear_recents` chỉ xóa các task mà giao diện Recents expose qua Accessibility và không tuyên bố dừng process nền.\n",
  "02-cai-dat-va-khoi-dong.md": "# Cài đặt và khởi động\n\n## Build APK\n\nChạy từ thư mục gốc repository:\n\n```bash\n./gradlew :appQa:assembleDebug\n```\n\nAPK debug được tạo trong:\n\n```text\nappQa/build/outputs/apk/debug/\n```\n\n## Cài APK bằng ADB\n\n```bash\nadb install -r appQa/build/outputs/apk/debug/appQa-debug.apk\n```\n\nTên package là `hdisoft.app.qa`.\n\n## Các quyền cần thiết\n\n### Accessibility\n\nTừ màn hình chính, chọn **Enable Accessibility**, tìm `appQa` trong Android Settings rồi bật service. Đây là điều kiện để tap, swipe, nhập text và điều hướng hệ thống.\n\n### Draw over other apps\n\nChọn **Grant Overlay Permission** và bật quyền vẽ trên ứng dụng khác. Nếu chưa có quyền này, QA Automation Service sẽ không khởi động.\n\n### Screen Capture\n\nNhấn **Start Service**. Android hiển thị hộp thoại Media Projection; chọn cho phép để app có thể chụp và quay màn hình. Quyền này gắn với phiên service hiện tại và có thể phải cấp lại sau khi service dừng.\n\n### Notification\n\nAndroid 13 trở lên yêu cầu `POST_NOTIFICATIONS`. App hỏi quyền khi mở để foreground service hoạt động ổn định và hiển thị trạng thái.\n\n### Storage\n\nTrên Android 10 trở lên, ảnh/video được lưu bằng MediaStore và không cần quyền ghi bộ nhớ kiểu cũ. `WRITE_EXTERNAL_STORAGE` chỉ được khai báo đến API 28 để tương thích Android cũ.\n\n## Trạng thái trên màn hình chính\n\nMàn hình chính cập nhật mỗi giây các trạng thái:\n\n- Accessibility: `ENABLED` hoặc `DISABLED`.\n- Overlay: `GRANTED` hoặc `DENIED`.\n- QA Service: `RUNNING` hoặc `STOPPED`.\n- Web Server: `ONLINE` hoặc `OFFLINE`.\n\nWeb server tự khởi động khi mở MainActivity. Có thể bật/tắt riêng bằng các nút Web Server. Port mặc định hiện tại của `appQa` là **8086** để tránh trùng với ứng dụng CI-Deploy dùng port 8085.\n\n## Kết nối từ máy tính\n\n1. Điện thoại và máy tính phải ở cùng mạng LAN/Wi-Fi.\n2. Đọc URL được hiển thị trên MainActivity.\n3. Mở `http://<device-ip>:8086/` trên trình duyệt.\n4. Nếu không kết nối được, kiểm tra firewall, guest Wi-Fi/client isolation và trạng thái `ONLINE`.\n\n## Dừng ứng dụng an toàn\n\nNhấn nút Close trên floating control hoặc **Stop Service** trên MainActivity. Khi service bị hủy, app dừng ghi hình nếu còn chạy, giải phóng MediaProjection, gỡ overlay và xóa instance runtime.\n\n",
  "03-accessibility-automation.md": "# Accessibility và điều khiển thiết bị\n\n## Service đang sử dụng\n\n`QaAccessibilityService` là service duy nhất mà `ScriptTool` và floating control gọi. Service kế thừa `BaseAccessibilityGestureService` để dùng chung gesture dispatch và lifecycle, đồng thời giữ instance trong thời gian được Android kết nối.\n\n## Các thao tác hỗ trợ\n\n### Tap\n\n`clickAt(x, y)` tạo gesture tại tọa độ pixel tuyệt đối. Module có `minSdk 24` vì API `dispatchGesture()` chỉ tồn tại từ Android 7.0; Accessibility service phải đang active.\n\n### Swipe\n\n`swipe(startX, startY, endX, endY, durationMs)` tạo đường vuốt giữa hai điểm. Thời lượng mặc định là 300 ms.\n\n### Input text\n\n`inputText(text)` thử đặt text vào node đang focus trước. Nếu không tìm thấy, service duyệt cây UI để tìm node editable. Ứng dụng đích có thể từ chối thao tác nếu field không expose Accessibility action.\n\n### Điều hướng hệ thống\n\nService hỗ trợ các global action:\n\n- Back\n- Home\n- Recents\n\nFloating control hiện cung cấp Back và Home. Script runner và Action List cung cấp thêm Recents.\n\n## Floating Control\n\nCác nút theo chức năng:\n\n- Drag: kéo thanh công cụ đến vị trí khác.\n- Camera: chụp ảnh màn hình.\n- Record: bắt đầu hoặc dừng quay video.\n- AUTO: chạy chuỗi demo tap, nhập text, tap và capture.\n- Back/Home: gửi global action.\n- Close: dừng QA Automation Service.\n\nOverlay dùng tọa độ tuyệt đối. Khi thiết bị đổi độ phân giải, density, navigation mode hoặc orientation, tọa độ trong script có thể không còn chính xác.\n\n## Điều kiện chạy ổn định\n\n- Giữ màn hình mở và thiết bị đã unlock.\n- Đợi ứng dụng đích render xong trước khi gửi gesture.\n- Dùng tọa độ theo đúng độ phân giải thiết bị đang kiểm thử.\n- Kiểm tra trạng thái Accessibility sau khi app được cập nhật/cài lại vì Android có thể tắt service.\n",
  "04-media-va-bao-cao.md": "# Chụp ảnh, quay màn hình và báo cáo\n\n## Media Projection\n\n`QaAutomationService` nhận phiên Media Projection sau khi người dùng chấp thuận hộp thoại hệ thống. Cùng phiên này được dùng cho chụp ảnh và quay video.\n\nNếu Android thu hồi phiên, callback `onStop` sẽ dừng service. Cần mở lại app và cấp quyền Screen Capture để tạo phiên mới.\n\n## Chụp ảnh màn hình\n\n`ScreenCaptureHelper` tạo `VirtualDisplay` và đọc frame RGBA qua `ImageReader`.\n\nQuy trình:\n\n1. Ẩn floating control.\n2. Chờ ngắn để UI cập nhật.\n3. Đọc frame mới nhất.\n4. Loại bỏ row padding để ảnh đúng kích thước màn hình.\n5. Lưu PNG và hiển thị lại floating control.\n\nThao tác có timeout 2,5 giây nếu không nhận được frame.\n\nKhi chạy core action `capture`, runner chờ file được lưu vào reports rồi trả URL tương đối trong `output`:\n\n```json\n\"output\": \"/qa/reports/QA_Screenshot_1760000000000.png\"\n```\n\nURL dùng cùng origin với Web Portal, có thể mở trực tiếp hoặc hiển thị bằng thẻ `<img>`.\n\n## Quay màn hình\n\n`ScreenRecordHelper` dùng `MediaRecorder` với cấu hình:\n\n- Container: MP4.\n- Video codec: H.264.\n- Kích thước: độ phân giải vật lý của màn hình.\n- Frame rate: 30 fps.\n- Bitrate: 3 Mbps.\n- Audio: không được ghi.\n\nVideo ban đầu được ghi vào file tạm trong cache. Khi dừng, app sao chép file sang vùng reports và Gallery, sau đó xóa file tạm.\n\n## Hai nơi lưu kết quả\n\nMỗi media thành công được lưu ở hai nơi:\n\n### Vùng reports của ứng dụng\n\n```text\nAndroid/data/hdisoft.app.qa/files/reports/\n```\n\nWeb server đọc vùng này để hiển thị và tải file. Android hoặc file manager có thể hạn chế truy cập trực tiếp thư mục app-specific.\n\n### Gallery công khai\n\n- Ảnh: `Pictures/QAApp`\n- Video: `Movies/QAApp`\n\nTên file có timestamp:\n\n```text\nQA_Screenshot_<timestamp>.png\nQA_Recording_<timestamp>.mp4\n```\n\n## Trang Test Reports\n\nMở `http://<device-ip>:8086/reports` hoặc chọn **Test Reports** trong Web Portal. Trang cho phép lọc, preview ảnh/video và tải file về máy tính.\n\n## Lưu ý\n\n- Floating control chỉ được ẩn lúc bắt đầu capture/record; trong lúc quay, overlay có thể xuất hiện trở lại trong video.\n- Bản reports và bản Gallery là hai bản sao riêng.\n- Gỡ ứng dụng có thể xóa vùng app-specific reports, nhưng media đã xuất vào Gallery thường vẫn còn.\n- Video rất ngắn có thể lỗi khi `MediaRecorder.stop()` do chưa có đủ frame hợp lệ.\n",
  "05-web-portal-va-script.md": "# Web Portal, API và kịch bản JSON\n\n## Truy cập Portal\n\nWeb server mặc định của `appQa` chạy tại:\n\n```text\nhttp://<device-ip>:8086/\n```\n\nPortal có năm khu vực:\n\n- Home Dashboard\n- Script Console\n- Action List\n- Test Console\n- Test Reports\n\nGiao diện hiện tải Vue 3 và Google Font từ CDN, vì vậy một số phần có thể không hiển thị nếu thiết bị/máy tính không có Internet dù web server nội bộ vẫn truy cập được.\n\n## Script Console\n\nScript Console quản lý thư viện kịch bản trong database của webserver:\n\n- Tạo script mới.\n- Sửa tên và nội dung JSON.\n- Xóa script.\n- Chạy script đã lưu.\n- Chạy trực tiếp JSON mà không lưu.\n- Theo dõi số lần chạy, lần chạy cuối và lần cập nhật cuối.\n\n## Cấu trúc script\n\nXem mô tả field đầy đủ tại [Data model của Script](08-script-data-model.md) và file [JSON mẫu](examples/script-example.json).\n\nScript là một JSON array. Các step luôn chạy tuần tự; script nhiều step chạy trong coroutine nền, còn một step chạy đồng bộ để trả `output`:\n\n```json\n[\n  {\"name\": \"open_app\", \"category\": \"core\", \"input\": {\"query\": \"Calendar\"}},\n  {\"name\": \"tap\", \"category\": \"core\", \"input\": {\"x\": 102, \"y\": 399}},\n  {\"name\": \"home\", \"category\": \"core\"},\n  {\"name\": \"back\", \"category\": \"core\"},\n  {\"name\": \"recents\", \"category\": \"core\"},\n  {\"name\": \"wait\", \"category\": \"core\", \"input\": {\"duration\": 1000}},\n  {\"name\": \"clear_recents\", \"category\": \"core\"},\n  {\"name\": \"capture\", \"category\": \"core\"},\n  {\"name\": \"record\", \"category\": \"core\", \"input\": {\"duration\": 5000}}\n]\n```\n\n## Các action hiện được thực thi\n\n### open_app\n\n```json\n{\"name\": \"open_app\", \"category\": \"core\", \"input\": {\"query\": \"Calendar\"}}\n```\n\nMở ứng dụng theo tên hiển thị hoặc package. Runner chờ 2,5 giây sau thao tác.\n\n### tap\n\n```json\n{\"name\": \"tap\", \"category\": \"core\", \"input\": {\"x\": 102, \"y\": 399}}\n```\n\nChạm tọa độ tuyệt đối bằng `QaAccessibilityService`, sau đó chờ 1,5 giây.\n\n### home, back, recents\n\n```json\n{\"name\": \"home\", \"category\": \"core\"}\n```\n\nGửi phím điều hướng hệ thống tương ứng qua Accessibility service và trả Boolean trong `output`.\n\n### wait\n\n```json\n{\"name\": \"wait\", \"category\": \"core\", \"input\": {\"duration\": 1000}}\n```\n\nTạm dừng script theo số millisecond trong `input.duration`. Mặc định là 1.000 ms và trả `true` sau khi chờ xong.\n\n### clear_recents\n\n```json\n{\"name\": \"clear_recents\", \"category\": \"core\"}\n```\n\nAction dùng Accessibility mở Recents, tìm nút Clear/Close all (có hỗ trợ nhãn tiếng Việt) và click. Output gồm `success`, `method: \"accessibility\"` và `message`. Action chỉ xóa recent tasks; app Android thường không thể force-stop process của app khác.\n\n### capture\n\n```json\n{\"name\": \"capture\", \"category\": \"core\"}\n```\n\nYêu cầu QA Automation Service chụp ảnh và chờ callback lưu file hoàn tất.\n\nAction chỉ hoàn tất sau khi ảnh được ghi vào reports. `output` là URL ảnh dạng `/qa/reports/QA_Screenshot_<timestamp>.png`; Action List hiển thị ảnh ngay dưới JSON result và cho phép mở ảnh trong tab mới.\n\n### record\n\n```json\n{\"name\": \"record\", \"category\": \"core\", \"input\": {\"duration\": 5000}}\n```\n\nQuay trong số millisecond được chỉ định. Mặc định là 5000 ms. Action chờ callback start, dừng và lưu file hoàn tất; `output` thành công là URL `/qa/reports/QA_Recording_<timestamp>.mp4`.\n\n> `ScriptTool` hiện thực thi 9 core action lấy từ `ActionRegistry`. Các hàm swipe và input text tồn tại ở Accessibility service nhưng chưa được đăng ký thành JSON action.\n\n## API được Portal sử dụng\n\n- `GET /api/qa/scripts`: lấy danh sách script.\n- `GET /api/qa/steps`: lấy động danh sách core step từ `ActionRegistry`.\n- `POST /api/qa/scripts`: tạo script với `name` và `content`.\n- `PUT /api/qa/scripts?id=<id>`: cập nhật script.\n- `DELETE /api/qa/scripts?id=<id>`: xóa script.\n- `POST /api/qa/runscript`: chạy theo `id` hoặc gửi trực tiếp JSON array.\n- `POST /api/qa/openapp`: mở app với body `{\"query\":\"...\"}`.\n- `GET /api/qa/files`: danh sách media reports dùng bởi trang reports.\n\n### Lấy danh sách step hiện tại\n\n`GET /api/qa/scripts` trả script record, trong đó `content` là chuỗi JSON chứa danh sách step. Cần chọn script theo `id` rồi gọi `JSON.parse(script.content)`.\n\n```javascript\nconst scripts = await fetch('/api/qa/scripts').then(response => response.json());\nconst script = scripts.find(item => item.id === 12);\nconst steps = script ? JSON.parse(script.content) : [];\n```\n\nLấy các loại step có thể thêm vào script:\n\n```javascript\nconst definitions = await fetch('/api/qa/steps').then(response => response.json());\n```\n\nMỗi definition có `name`, `displayName`, `description`, `category`, `className`, input mặc định, kiểu `output` và object `example` dùng để thêm/chạy thử action. Action List không giữ một danh sách hard-code riêng trong `app.js`.\n\nXem ví dụ `curl`, `jq`, cách lấy step trong editor và giới hạn realtime tại [Cách lấy danh sách step hiện tại](12-lay-danh-sach-step-hien-tai.md).\n\nVí dụ chạy trực tiếp từ máy tính:\n\n```bash\ncurl -X POST http://<device-ip>:8086/api/qa/runscript \\\n  -H 'Content-Type: application/json' \\\n  -d '[{\"name\":\"open_app\",\"category\":\"core\",\"input\":{\"query\":\"Calendar\"}},{\"name\":\"capture\",\"category\":\"core\"}]'\n```\n\n## Hành vi thực thi\n\nVới một action, API chờ thực thi xong và trả model cùng `output`; Action List dùng luồng này để hiển thị kết quả. Với nhiều action, API trả thông báo đã bắt đầu và script tiếp tục trong coroutine nền. Chi tiết được ghi qua `WebserverLogger`.\n\nWebserver hiện phục vụ trên HTTP cleartext, trong mạng nội bộ, không thể hiện cơ chế xác thực trong module `appQa`. Chỉ nên chạy trên mạng tin cậy.\n",
  "06-kien-truc.md": "# Kiến trúc kỹ thuật\n\n## Các thành phần chính\n\n### MainActivity\n\nĐiểm vào của ứng dụng. Thành phần này:\n\n- Hiển thị và polling trạng thái quyền/service mỗi giây.\n- Mở Android Settings để cấp Accessibility và Overlay.\n- Xin quyền Media Projection.\n- Start/stop QA Automation Service và Web Server.\n- Đặt port webserver mặc định thành 8086.\n- Thử tự cấp một số quyền khi phát hiện thiết bị root.\n\n### QaAutomationService\n\nForeground service quản lý vòng đời Media Projection, floating overlay, capture/record và kết nối callback chạy script cho webserver.\n\n### QaAccessibilityService\n\nKế thừa `BaseAccessibilityGestureService` để thực thi gesture và quản lý lifecycle kết nối. Service bổ sung input text, tìm nút Clear all và global action; `ScriptTool` truy cập instance runtime này để chạy action.\n\n### ScriptTool\n\nParse JSON array bằng Gson thành `ActionModel` và gọi `doIt()` theo thứ tự. Một step chạy đồng bộ để Web Action List nhận `output`; script nhiều step chạy trong coroutine `Dispatchers.Default`. Gesture được chuyển về main looper.\n\n### ActionModel và ActionRegistry\n\n- `ActionModel` định nghĩa contract runtime, ID tăng dần, Gson serialization và method `doIt()`.\n- `CoreActions.kt` chứa implementation của từng core step.\n- `ActionRegistry` là nguồn dữ liệu duy nhất cho factory, category và definition của 9 core step.\n- Khi thêm core step, implement concrete `ActionModel` rồi gọi `registerCore(...)`; Gson và Web Action List cùng nhận mapping mới.\n\n### ScreenCaptureHelper\n\nĐóng gói `VirtualDisplay`, `ImageReader` và chuyển raw buffer thành Bitmap.\n\n### ScreenRecordHelper\n\nĐóng gói `MediaRecorder`, surface và `VirtualDisplay` cho video H.264.\n\n### MediaSaveHelper\n\nLưu media vào app-specific reports và MediaStore/Gallery.\n\n### Webserver package\n\nModule phụ thuộc artifact `hdisoft.app:webserver:1.0.0`. Assets HTML/CSS/JS của Portal nằm trong `appQa/src/main/assets`. `QaWebRequestHandler` phục vụ `GET /api/qa/steps` từ registry ngay khi MainActivity khởi tạo web server. `SimpleHttpServer.scriptExecutor` được gắn với `ScriptTool` khi QA Automation Service khởi động.\n\n## Luồng lệnh từ Web Portal\n\n```text\nBrowser\n  -> HTTP API :8086\n  -> SimpleHttpServer\n  -> QaWebRequestHandler (GET /api/qa/steps)\n  -> ScriptExecutor callback\n  -> ScriptTool\n  -> AppTool / QaAccessibilityService / QaAutomationService\n  -> Android app hoặc Media Projection\n  -> reports + Gallery\n```\n\n## Vòng đời quan trọng\n\n- Web server có thể chạy độc lập với QA Automation Service.\n- `GET /api/qa/steps` hoạt động khi web server online, không phụ thuộc Media Projection.\n- `wait` không cần Accessibility hoặc Media Projection.\n- `clear_recents` cần Accessibility và chỉ xóa task được giao diện Recents expose; không force-stop process.\n- `open_app` có thể hoạt động khi server online.\n- `tap`, `home`, `back`, `recents` cần Accessibility service chính active.\n- `capture` và `record` cần QA Automation Service cùng Media Projection active.\n- Khi QA Automation Service được start, callback ScriptExecutor được đăng ký cho webserver.\n\n## Cấu hình build\n\n- Namespace/application ID: `hdisoft.app.qa`\n- minSdk: 24, vì action gesture dùng `AccessibilityService.dispatchGesture()`.\n- targetSdk/compileSdk: 34\n- Java/Kotlin target: 17\n- Version: 1.0.0\n- `BUILD_NO`: sinh theo thời gian build với định dạng `yyyyMMddHHmm`\n\n## Điểm cần chú ý khi bảo trì\n\n- Port nguồn sự thật được set trong `MainActivity`; tránh hard-code port khác trong toast hoặc tài liệu.\n- Core step mới cần concrete `ActionModel` và một entry `ActionRegistry.registerCore(...)`; không thêm nhánh dispatch vào `ScriptTool`.\n- Action List tải definition từ `/api/qa/steps`; không khai báo lại action trong `assets/js/app.js`.\n- Nếu đổi contract của definition API, cập nhật client đọc API và các tài liệu liên quan.\n- Các thao tác media phải giải phóng `VirtualDisplay`, `ImageReader` và `MediaRecorder` trong cả luồng thành công lẫn lỗi.\n",
  "07-xu-ly-su-co.md": "# Xử lý sự cố và giới hạn\n\n## Accessibility vẫn hiển thị DISABLED\n\n- Quay lại Android Settings và bật đúng service `appQa`.\n- Tắt/bật lại service sau khi cài APK mới.\n- Kiểm tra app có bị hệ thống giới hạn accessibility vì cài từ nguồn ngoài hay không.\n\n## Không khởi động được QA Service\n\n- Cấp Overlay trước khi nhấn Start Service.\n- Chấp thuận hộp thoại Screen Capture.\n- Trên Android 13+, cấp Notification.\n- Kiểm tra notification foreground có xuất hiện.\n- Dừng phiên cũ rồi xin lại Media Projection nếu phiên đã bị Android thu hồi.\n\n## Tap sai vị trí hoặc không phản hồi\n\n- Xác nhận Accessibility chính đang active.\n- Kiểm tra tọa độ theo độ phân giải hiện tại.\n- Tránh đổi orientation trong lúc chạy script.\n- Tăng thời gian chờ bằng cách tách luồng hoặc mở rộng runner; delay hiện đang cố định.\n- Một số màn hình bảo mật hoặc ứng dụng hệ thống có thể chặn gesture.\n\n## Input text không hoạt động\n\n- Đảm bảo ô nhập liệu đang focus và expose Accessibility node.\n- Thử tap vào field trước khi gọi input.\n- Một số custom view, canvas hoặc field bảo mật không hỗ trợ `ACTION_SET_TEXT`.\n- JSON Script Runner hiện chưa có action `input_text`; chỉ API Kotlin của Accessibility service có chức năng này.\n\n## Chụp ảnh timeout hoặc ảnh đen\n\n- Kiểm tra Media Projection còn active.\n- Nội dung có `FLAG_SECURE` sẽ không thể chụp bình thường.\n- Thử dừng rồi start lại QA Service.\n- Không chạy capture và record chồng lấp trên cùng phiên.\n\n## Video không được lưu\n\n- Tránh dừng video ngay sau khi bắt đầu.\n- Kiểm tra dung lượng trống.\n- Xem log lỗi `MediaRecorder.stop()`.\n- Xác nhận file đã xuất hiện trong cả `/reports` và `Movies/QAApp`.\n\n## Không mở được Web Portal\n\n- Dùng port **8086**, không dùng 8085.\n- Điện thoại và máy tính phải cùng mạng và không bị client isolation.\n- Kiểm tra trạng thái Web Server là `ONLINE`.\n- Thử URL `http://<device-ip>:8086/reports`.\n- Nếu khung Portal trắng nhưng `/reports` vẫn chạy, kiểm tra Internet/CDN vì Portal dùng Vue từ `unpkg.com`.\n\n## Script API trả success nhưng không có hành động\n\nVới script nhiều step, API chỉ xác nhận runner đã bắt đầu. Với đúng một step, API chờ thực thi và trả action cùng `output`. Nếu không có hành động như mong đợi, kiểm tra từng dependency:\n\n- `open_app`: app/package phải tồn tại.\n- `tap`: Accessibility service chính phải active.\n- `home`/`back`/`recents`: Accessibility service chính phải active; `output: false` nghĩa global action không được chấp nhận.\n- `wait`: không cần service phụ; kiểm tra `input.duration` là number millisecond hợp lệ.\n- `clear_recents`: Accessibility service phải active và giao diện Recents phải expose nút `Clear all`, `Close all`, `Dismiss all`, `Xóa/Xoá tất cả` hoặc `Đóng tất cả`. Nếu output báo không tìm thấy nút, OEM đang dùng nhãn/layout khác. Action không force-stop process nền.\n- `capture`: QA Automation Service phải active; thành công phải trả URL `/qa/reports/*.png`. Nếu không có preview, mở URL output trực tiếp và kiểm tra file trong `/reports`.\n- `record`: QA Automation Service phải active.\n- Core action phải là `open_app`, `tap`, `home`, `back`, `recents`, `wait`, `clear_recents`, `capture` hoặc `record`. Có thể kiểm tra danh sách runtime bằng `GET /api/qa/steps`.\n- Xem `WebserverLogger` để biết step nào bị bỏ qua hoặc lỗi.\n\n## Giới hạn bảo mật\n\nWebserver dùng HTTP và được thiết kế cho LAN. Không expose port ra Internet. Vì Portal có thể mở app và chạy thao tác trên thiết bị, chỉ kết nối thiết bị vào mạng kiểm thử đáng tin cậy và dừng webserver khi không sử dụng.\n",
  "08-script-data-model.md": "# Data model của Script\n\n## Tổng quan\n\nPhần Script có hai lớp dữ liệu riêng:\n\n1. **Script record**: metadata do Script Library lưu và trả về.\n2. **Script content**: JSON array chứa các bước được `ScriptTool` thực thi tuần tự.\n\nFile mẫu: [script-example.json](examples/script-example.json).\n\n## Script record\n\nMột script đọc từ `GET /api/qa/scripts` có dạng:\n\n```json\n{\n  \"id\": 12,\n  \"name\": \"Calendar smoke test\",\n  \"content\": \"[{\\\"name\\\":\\\"open_app\\\",\\\"input\\\":{\\\"query\\\":\\\"Calendar\\\"}}]\",\n  \"runCount\": 4,\n  \"lastRun\": \"2026-08-13T10:30:00Z\",\n  \"lastUpdate\": \"2026-08-13T09:15:00Z\"\n}\n```\n\n| Field | Kiểu | Bắt buộc khi lưu | Mô tả |\n|---|---|---:|---|\n| `id` | Number | Không | ID do database tạo. Dùng để sửa, xóa hoặc chạy script đã lưu. |\n| `name` | String | Có | Tên hiển thị trong Script Library. Không được rỗng. |\n| `content` | String | Có | Chuỗi chứa một JSON array hợp lệ. |\n| `runCount` | Number | Không | Tổng số lần script đã lưu được chạy. |\n| `lastRun` | ISO date/string | Không | Thời điểm chạy gần nhất. Có thể rỗng nếu chưa chạy. |\n| `lastUpdate` | ISO date/string | Không | Thời điểm cập nhật gần nhất. |\n\nKhi tạo hoặc cập nhật, Portal chỉ gửi các field người dùng quản lý:\n\n```json\n{\n  \"name\": \"Calendar smoke test\",\n  \"content\": \"[{\\\"name\\\":\\\"open_app\\\",\\\"input\\\":{\\\"query\\\":\\\"Calendar\\\"}}]\"\n}\n```\n\nCác field `id`, `runCount`, `lastRun` và `lastUpdate` do backend quản lý.\n\n## Script content\n\n`content` sau khi parse phải là một JSON array. Mỗi phần tử là một `ActionModel`; chỉ field `name` bắt buộc.\n\n```json\n[\n  {\"name\": \"open_app\", \"category\": \"core\", \"input\": {\"query\": \"Calendar\"}},\n  {\"name\": \"tap\", \"category\": \"core\", \"input\": {\"x\": 102, \"y\": 399}},\n  {\"name\": \"home\", \"category\": \"core\"},\n  {\"name\": \"back\", \"category\": \"core\"},\n  {\"name\": \"recents\", \"category\": \"core\"},\n  {\"name\": \"wait\", \"category\": \"core\", \"input\": {\"duration\": 1000}},\n  {\"name\": \"clear_recents\", \"category\": \"core\"},\n  {\"name\": \"capture\", \"category\": \"core\"},\n  {\"name\": \"record\", \"category\": \"core\", \"input\": {\"duration\": 5000}}\n]\n```\n\nCác step chạy theo đúng thứ tự trong array. Với đúng một step, API chờ `doIt()` và trả action cùng `output`. Với nhiều step, API trả ngay trạng thái đã bắt đầu và runner tiếp tục trong coroutine nền; HTTP success không có nghĩa toàn bộ script đã hoàn tất.\n\n## Đọc danh sách step từ API\n\n`GET /api/qa/scripts` trả một array script record. Vì `content` là String, client phải parse thêm một lần:\n\n```javascript\nconst scripts = await fetch('/api/qa/scripts').then(response => response.json());\nconst script = scripts.find(item => item.id === 12);\nconst steps = script ? JSON.parse(script.content) : [];\n```\n\n`GET /api/qa/steps` trả các loại step đăng ký trong `ActionRegistry`. API chưa trả current step đang chạy. Hướng dẫn đầy đủ: [Cách lấy danh sách step hiện tại](12-lay-danh-sach-step-hien-tai.md).\n\nDanh sách runtime hiện có 9 core step: `open_app`, `tap`, `home`, `back`, `recents`, `wait`, `clear_recents`, `capture`, `record`.\n\n## Action model\n\nChi tiết cấu trúc, Gson mapping, `doIt()` và JSON Schema nằm tại [Data model của Action](09-action-data-model.md).\n\n### open_app\n\n```json\n{\"name\": \"open_app\", \"input\": {\"query\": \"Calendar\"}}\n```\n\n| Field | Kiểu | Bắt buộc | Quy tắc |\n|---|---|---:|---|\n| `name` | String | Có | Giá trị `open_app`. |\n| `input.query` | String | Handler cần | Tên hiển thị hoặc package của ứng dụng. |\n\nRunner chờ 2.500 ms sau khi gửi lệnh mở app.\n\n### tap\n\n```json\n{\"name\": \"tap\", \"input\": {\"x\": 102, \"y\": 399}, \"output\": null}\n```\n\n| Field | Kiểu | Bắt buộc | Quy tắc |\n|---|---|---:|---|\n| `name` | String | Có | Giá trị `tap`. |\n| `input.x` | Number | Handler cần | Tọa độ pixel ngang. |\n| `input.y` | Number | Handler cần | Tọa độ pixel dọc. |\n\nRunner chờ 1.500 ms sau khi dispatch gesture. `QaAccessibilityService` phải đang active.\n\n### home, back, recents\n\n```json\n{\"name\": \"home\"}\n```\n\nBa step không cần `input`, gửi Android global action tương ứng qua `QaAccessibilityService`, đặt `output` thành Boolean và chờ 500 ms.\n\n### wait\n\n```json\n{\"name\": \"wait\", \"input\": {\"duration\": 1000}}\n```\n\n`input.duration` là số millisecond, mặc định `1000`. Giá trị âm được giới hạn về `0`; `output` là `true` sau khi chờ hoàn tất.\n\n### clear_recents\n\n```json\n{\"name\": \"clear_recents\"}\n```\n\nKhông cần `input`. Action mở màn hình Recents và click nút Clear/Close all qua Accessibility. Output:\n\n```json\n{\n  \"success\": true,\n  \"method\": \"accessibility\",\n  \"message\": \"Requested removal of all tasks exposed by Android Recents.\"\n}\n```\n\n`success` chỉ xác nhận thao tác trên nút Recents đã được chấp nhận. Nó không đồng nghĩa process nền đã bị force-stop. Android không cho app release thông thường force-stop app khác, kể cả khi người dùng đã cấp toàn bộ runtime permission và Accessibility.\n\n### capture\n\n```json\n{\"name\": \"capture\"}\n```\n\nAction không có field bổ sung. `QaAutomationService` và Media Projection phải đang active. Runner chờ callback capture và lưu file hoàn tất. Khi thành công, `output` là URL tương đối `/qa/reports/QA_Screenshot_<timestamp>.png`; khi capture/lưu report thất bại, `output` là null.\n\n### record\n\n```json\n{\"name\": \"record\", \"input\": {\"duration\": 5000}}\n```\n\n| Field | Kiểu | Bắt buộc | Quy tắc |\n|---|---|---:|---|\n| `name` | String | Có | Giá trị `record`. |\n| `input.duration` | Number | Không | Millisecond; mặc định `5000`. |\n\nAction chỉ bắt đầu đếm duration sau khi recorder báo start thành công. Khi dừng và lưu report thành công, `output` là URL `/qa/reports/QA_Recording_<timestamp>.mp4`; nếu start/stop/lưu thất bại, `output` là null.\n\n`QaAutomationService` và Media Projection phải đang active. Runner chờ thêm 2.000 ms sau khi dừng để hoàn tất và lưu video.\n\n## Payload chạy script\n\n### Chạy nội dung trực tiếp\n\nGửi JSON array làm HTTP body:\n\n```bash\ncurl -X POST http://<device-ip>:8086/api/qa/runscript \\\n  -H 'Content-Type: application/json' \\\n  --data-binary @examples/script-example.json\n```\n\n### Chạy script đã lưu\n\nGửi ID của script record:\n\n```json\n{\"id\": 12}\n```\n\n## Validation và giá trị mặc định\n\n- Root phải là JSON array khi chạy trực tiếp.\n- Chỉ `name` bắt buộc; `name` được trim và chuyển về chữ thường khi chọn handler.\n- `id` là Int được runtime sinh tự động, tăng dần và không trùng trong process.\n- `displayName` mặc định bằng `name`.\n- `category` có hai giá trị `core` và `other`.\n- `id` runtime luôn là Int không null. `description`, `input`, `output` có thể null.\n- `input` và `output` là dynamic JSON data.\n- Action không được hỗ trợ sẽ được ghi warning và bỏ qua.\n- `open_app.query` mặc định là chuỗi rỗng.\n- `tap.x` và `tap.y` mặc định là `-1`, vì vậy step thiếu tọa độ sẽ bị bỏ qua.\n- `record.duration` mặc định là 5.000 ms.\n- `wait.duration` mặc định là 1.000 ms.\n- Runner hiện chưa hỗ trợ JSON action cho `swipe`, `input_text` hoặc assertion. Các action `home`, `back`, `recents` đã được hỗ trợ.\n\n## Quy ước đề xuất\n\n- Đặt `name` mô tả mục tiêu kiểm thử, ví dụ `Calendar - create event smoke test`.\n- Dùng package name thay cho tên app nếu cần kết quả mở app ổn định giữa nhiều ngôn ngữ.\n- Ghi tọa độ theo đúng độ phân giải và orientation của thiết bị mục tiêu.\n- Giữ video dài ít nhất vài giây để `MediaRecorder` có đủ frame hợp lệ.\n- Không đặt secret, token hoặc dữ liệu nhạy cảm trong script vì Portal chạy qua HTTP nội bộ.\n",
  "09-action-data-model.md": "# ActionModel\n\n## Contract\n\n`ActionModel` là model dùng chung cho mọi action trong script:\n\n```kotlin\nabstract class ActionModel(\n    val id: Int,\n    val name: String,\n    val displayName: String = name,\n    val description: String? = null,\n    val category: ActionCategory,\n    val input: Any? = null,\n    var output: Any? = null\n) {\n    abstract suspend fun doIt(context: Context): Any?\n}\n```\n\nJSON tương ứng:\n\n```json\n{\n  \"id\": 1,\n  \"name\": \"tap\",\n  \"displayName\": \"tap\",\n  \"description\": null,\n  \"category\": \"core\",\n  \"input\": {\n    \"x\": 102,\n    \"y\": 399\n  },\n  \"output\": null\n}\n```\n\n## Fields\n\n| Field | Kiểu | Bắt buộc | Default | Mô tả |\n|---|---|---:|---|---|\n| `id` | Int | Runtime luôn có | Sinh tự động | ID bắt đầu từ 1, tăng dần và không trùng trong process. |\n| `name` | String | **Có** | Không có | Tên action mà runner dùng để chọn handler. |\n| `displayName` | String | Không | Bằng `name` | Tên thân thiện dùng trên giao diện. |\n| `description` | String/null | Không | `null` | Nội dung mô tả action. |\n| `category` | `core`/`other` | Không | Theo `name` | Nhóm action. Built-in action thuộc `core`; action mở rộng thuộc `other`. |\n| `input` | Dynamic/null | Không | `null` | Dữ liệu đầu vào tùy action: object, array, string, number, boolean hoặc null. |\n| `output` | Dynamic/null | Không | `null` | Kết quả tùy action; runner có thể cập nhật sau khi xử lý. |\n\n## Validation\n\nChỉ `name` được dùng để xác định model hợp lệ:\n\n```text\nvalid = name.trim().isNotEmpty()\n```\n\n- JSON đầu vào có thể không có `id`; `ActionModel.fromJson` luôn sinh một ID mới không null.\n- ID trong JSON đầu vào bị bỏ qua để client không thể tạo ID trùng.\n- `displayName` có thể thiếu; khi đó nhận giá trị của `name`.\n- `description`, `input`, `output` có thể thiếu hoặc null.\n- `category` chỉ có `core` hoặc `other`.\n- Không validate shape của `input`/`output` ở cấp `ActionModel` vì đây là dữ liệu dynamic.\n- Handler của từng action tự đọc và kiểm tra các field cần thiết trong `input`.\n\nModel tối thiểu hợp lệ:\n\n```json\n{\"name\": \"capture\"}\n```\n\nModel không hợp lệ:\n\n```json\n{\"name\": \"   \"}\n```\n\n## Dynamic input và output\n\n`input` và `output` dùng `Any?` trong Kotlin. Gson map JSON động thành:\n\n- `Map<String, Any?>`\n- `List<Any?>`\n- `String`\n- `Number`\n- `Boolean`\n- `null`\n\nCác action hiện tại dùng object làm `input`. Ví dụ `tap`:\n\n```json\n{\n  \"id\": 2,\n  \"name\": \"tap\",\n  \"category\": \"core\",\n  \"input\": {\n    \"x\": 102,\n    \"y\": 399\n  }\n}\n```\n\nNếu runner dispatch tap thành công, `output` runtime có thể là boolean:\n\n```json\n{\n  \"id\": 3,\n  \"name\": \"tap\",\n  \"category\": \"core\",\n  \"input\": {\"x\": 102, \"y\": 399},\n  \"output\": true\n}\n```\n\nVới một action, API trả lại model runtime cùng `output` sau khi `doIt()` hoàn tất. Với nhiều action, runner thực thi nền và kết quả từng step được ghi qua logger.\n\n## Method doIt()\n\nMỗi concrete action chịu trách nhiệm thực thi chính nó:\n\n```kotlin\nabstract suspend fun doIt(context: Context): Any?\n```\n\n| Concrete class | `name` | Logic trong `doIt()` |\n|---|---|---|\n| `OpenAppAction` | `open_app` | Mở ứng dụng, cập nhật output, delay. |\n| `TapAction` | `tap` | Dispatch Accessibility gesture, cập nhật output, delay. |\n| `WaitAction` | `wait` | Chờ theo duration rồi trả `true`. |\n| `ClearRecentsAction` | `clear_recents` | Mở Recents và click nút clear-all bằng Accessibility. |\n| `HomeAction` | `home` | Gửi global action Home và cập nhật output. |\n| `BackAction` | `back` | Gửi global action Back và cập nhật output. |\n| `RecentsAction` | `recents` | Gửi global action Recents và cập nhật output. |\n| `CaptureAction` | `capture` | Chờ capture/lưu report và trả URL ảnh. |\n| `RecordAction` | `record` | Chờ start, record theo duration, stop/lưu và trả URL video. |\n| `OtherAction` | tên mở rộng | Trả `false` cho action chưa có implementation. |\n\n`ScriptTool` chỉ điều phối:\n\n```kotlin\nval actions = ActionModel.listFromJson(jsonScript)\nactions.forEach { action -> action.doIt(context) }\n```\n\n## Gson mapping\n\n`ActionModelJsonAdapter` chọn concrete class theo `name` thông qua `ActionRegistry`. Registry cũng cung cấp cùng definition cho `GET /api/qa/steps`, vì vậy Gson dispatch và Web Action List không có hai danh sách riêng. API mapping:\n\n```kotlin\nval action = ActionModel.fromJson(jsonString)\nval json = action.toJson()\n\nval actions = ActionModel.listFromJson(jsonArrayString)\nval jsonArray = ActionModel.listToJson(actions)\n```\n\nKhi serialize, JSON luôn chứa `id`, `name`, `displayName`, `description`, `category`, `input`, `output`. Khi deserialize, `id` trong JSON bị bỏ qua và instance nhận ID mới.\n\n## Input theo action hiện tại\n\n| `name` | `category` | `input` | `output` runtime |\n|---|---|---|---|\n| `open_app` | `core` | `{\"query\":\"Calendar\"}` | Boolean từ lệnh mở app. |\n| `tap` | `core` | `{\"x\":102,\"y\":399}` | Boolean từ lúc dispatch gesture. |\n| `home` | `core` | `null` | Boolean từ `GLOBAL_ACTION_HOME`. |\n| `back` | `core` | `null` | Boolean từ `GLOBAL_ACTION_BACK`. |\n| `recents` | `core` | `null` | Boolean từ `GLOBAL_ACTION_RECENTS`. |\n| `wait` | `core` | `{\"duration\":1000}` | `true` sau khi chờ xong. |\n| `clear_recents` | `core` | `null` | Object success/method/message. |\n| `capture` | `core` | `null` | URL `/qa/reports/*.png`, hoặc null khi thất bại. |\n| `record` | `core` | `{\"duration\":5000}` | URL `/qa/reports/*.mp4`, hoặc null khi thất bại. |\n\n## Ví dụ đầy đủ\n\n```json\n{\n  \"id\": 4,\n  \"name\": \"tap\",\n  \"displayName\": \"Tap Search button\",\n  \"description\": \"Tap nút Search trên màn hình Calendar\",\n  \"category\": \"core\",\n  \"input\": {\n    \"x\": 102,\n    \"y\": 399\n  },\n  \"output\": null\n}\n```\n\n## Tương thích format cũ\n\nRunner vẫn đọc format cũ trong giai đoạn chuyển đổi:\n\n```json\n{\"action\": \"tap\", \"x\": 102, \"y\": 399}\n```\n\nFormat cũ được ánh xạ như sau:\n\n- `action` → `name`\n- Toàn bộ object cũ → `input`\n- `displayName` → mặc định bằng `name`\n- ID mới → được sinh tự động\n- `category` → tự suy ra theo `name`\n\n## Sinh ID\n\n`ActionModel` dùng `AtomicInteger` dùng chung trong process:\n\n```text\nAction đầu tiên  -> id = 1\nAction tiếp theo -> id = 2\nAction tiếp theo -> id = 3\n```\n\n`getAndIncrement()` bảo đảm hai action được tạo đồng thời không nhận cùng ID. Bộ đếm không reset giữa các script trong cùng process; nó chỉ reset khi process ứng dụng khởi động lại.\n\n## Category\n\n```kotlin\nenum class ActionCategory(val wireName: String) {\n    CORE(\"core\"),\n    OTHER(\"other\")\n}\n```\n\n- `core`: action tích hợp sẵn gồm `open_app`, `tap`, `home`, `back`, `recents`, `wait`, `clear_recents`, `capture`, `record`.\n- `other`: action mở rộng hoặc action chưa thuộc danh sách core.\n- Nếu JSON truyền category hợp lệ, runner sử dụng giá trị đó.\n- Nếu thiếu/sai category, runner suy ra từ `name`.\n\nScript mới nên luôn dùng contract `name` + `input`.\n\n## File liên quan\n\n- Kotlin model: `appQa/src/main/java/hdisoft/app/qa/model/ActionModel.kt`\n- Registry/factory: `appQa/src/main/java/hdisoft/app/qa/model/ActionRegistry.kt`\n- Runner: `appQa/src/main/java/hdisoft/app/qa/ScriptTool.kt`\n- Concrete implementations: `appQa/src/main/java/hdisoft/app/qa/model/CoreActions.kt`\n- JSON Schema: [script-actions.schema.json](examples/script-actions.schema.json)\n- Script mẫu: [script-example.json](examples/script-example.json)\n- Hướng dẫn action: [Mô tả Action](10-mo-ta-action.md)\n- Definition và source mapping: [Action Definitions](11-action-definitions.md)\n",
  "10-mo-ta-action.md": "# Mô tả Action\n\nMỗi phần tử trong script được parse thành một `ActionModel`. `id` được sinh tự động tăng dần; chỉ `name` cần có trong JSON đầu vào. Action built-in thuộc category `core`; action mở rộng thuộc `other`.\n\n## tap\n\nChạm vào tọa độ pixel tuyệt đối bằng Accessibility gesture.\n\n```json\n{\n  \"name\": \"tap\",\n  \"category\": \"core\",\n  \"input\": {\n    \"x\": 102,\n    \"y\": 399\n  },\n  \"output\": null\n}\n```\n\n- `input.x`: tọa độ ngang, mặc định `-1` nếu thiếu.\n- `input.y`: tọa độ dọc, mặc định `-1` nếu thiếu.\n- Cần `QaAccessibilityService` active.\n- `output`: boolean cho biết gesture đã được dispatch hay chưa.\n- Runner chờ 1.500 ms trước action tiếp theo.\n\n## open_app\n\nMở app theo tên hiển thị hoặc package name.\n\n```json\n{\n  \"name\": \"open_app\",\n  \"displayName\": \"Open Calendar\",\n  \"category\": \"core\",\n  \"input\": {\n    \"query\": \"Calendar\"\n  }\n}\n```\n\n- `input.query`: tên app hoặc package.\n- `output`: boolean từ `AppTool.openApp`.\n- Runner chờ 2.500 ms để app render.\n\n## capture\n\nChụp màn hình và lưu ảnh vào reports cùng Gallery.\n\n```json\n{\n  \"name\": \"capture\",\n  \"category\": \"core\"\n}\n```\n\n- `input` có thể null.\n- Cần QA Automation Service và Media Projection active.\n- Runner chờ callback capture và việc lưu file report hoàn tất.\n- `output` là URL tương đối `/qa/reports/QA_Screenshot_<timestamp>.png` khi thành công, hoặc null khi thất bại.\n- Action List tự render preview từ URL và có thể mở ảnh trong tab mới.\n\n## wait\n\nTạm dừng script mà không thao tác lên thiết bị.\n\n```json\n{\"name\": \"wait\", \"category\": \"core\", \"input\": {\"duration\": 1000}}\n```\n\n- `input.duration`: thời gian chờ theo millisecond, mặc định `1000`.\n- Giá trị âm được giới hạn về `0`.\n- `output` là `true` sau khi chờ hoàn tất.\n\n## home, back, recents\n\nĐiều khiển ba phím điều hướng hệ thống Android bằng Accessibility global action.\n\n```json\n[\n  {\"name\": \"home\", \"category\": \"core\"},\n  {\"name\": \"back\", \"category\": \"core\"},\n  {\"name\": \"recents\", \"category\": \"core\"}\n]\n```\n\n- `input` có thể null.\n- Cần `QaAccessibilityService` active.\n- `output`: boolean cho biết Android có chấp nhận global action hay không.\n- Runner chờ 500 ms trước action tiếp theo.\n- Ba action có thể chạy thử riêng từ Action List trên Web Portal.\n\n## clear_recents\n\nXóa các task mà màn hình Recents của thiết bị cho phép xóa.\n\n```json\n{\"name\": \"clear_recents\", \"category\": \"core\", \"input\": null}\n```\n\n- Dùng Accessibility mở Recents, cuộn tìm và click nút Clear/Close/Dismiss all.\n- `output` là object gồm `success`, `method: \"accessibility\"` và `message`.\n- Không force-stop process nền. Android không cấp quyền này cho app release thông thường, kể cả khi đã cấp đầy đủ runtime permission và Accessibility.\n- Runner chờ thêm 500 ms sau thao tác.\n\n## record\n\nQuay màn hình trong khoảng thời gian chỉ định.\n\n```json\n{\n  \"name\": \"record\",\n  \"category\": \"core\",\n  \"input\": {\n    \"duration\": 5000\n  }\n}\n```\n\n- `input.duration`: millisecond, mặc định `5000`.\n- Cần QA Automation Service và Media Projection active.\n- Action chờ callback start trước khi đếm duration và chờ lưu file khi stop.\n- `output` là URL `/qa/reports/QA_Recording_<timestamp>.mp4` khi thành công, hoặc null khi thất bại.\n- Runner chờ thêm 2.000 ms để hoàn tất file.\n\n## Script hoàn chỉnh\n\n```json\n[\n  {\n    \"name\": \"open_app\",\n    \"displayName\": \"Open Calendar\",\n    \"description\": \"Mở ứng dụng Calendar\",\n    \"category\": \"core\",\n    \"input\": {\"query\": \"Calendar\"},\n    \"output\": null\n  },\n  {\n    \"name\": \"tap\",\n    \"category\": \"core\",\n    \"input\": {\"x\": 102, \"y\": 399}\n  },\n  {\n    \"name\": \"wait\",\n    \"category\": \"core\",\n    \"input\": {\"duration\": 1000}\n  },\n  {\n    \"name\": \"capture\",\n    \"category\": \"core\"\n  }\n]\n```\n\nFile chạy trực tiếp: [script-example.json](examples/script-example.json).\n\n## Luồng thực thi\n\n```text\nJSON object\n  -> Gson ActionModelJsonAdapter\n  -> concrete ActionModel\n  -> sinh id Int tăng dần\n  -> validate name\n  -> xác định category core/other\n  -> action.doIt(context)\n  -> cập nhật dynamic output\n```\n\nVới một action, API chờ `doIt()` hoàn tất và trả model runtime cùng `output`. Script có nhiều action tiếp tục chạy trong coroutine nền và API trả response ngay khi bắt đầu.\n\nDanh sách definition dùng trên Web Portal được lấy từ `GET /api/qa/steps`. Hiện có 9 core action; `wait` và `clear_recents` đều được tự động đưa lên Action List từ `ActionRegistry`.\n",
  "11-action-definitions.md": "# Action Definitions\n\n## Phạm vi đối chiếu\n\nDanh sách này được map trực tiếp với source code hiện tại trong:\n\n- `ActionRegistry.kt`: nguồn dữ liệu duy nhất cho definition và factory của core action.\n- `ActionModel.kt`: model, Gson adapter, ID runtime và category.\n- `CoreActions.kt`: concrete action và method `doIt()`.\n- `ScriptTool.kt`: parse danh sách và điều phối thực thi.\n- `QaAccessibilityService.kt`: gesture, nhập text và navigation.\n- `BaseAccessibilityGestureService.kt`: gesture/navigation dùng chung bởi service chính.\n- `QaAutomationService.kt`: screenshot, record và demo AUTO.\n- `QaWebRequestHandler.kt`: endpoint `GET /api/qa/steps`.\n- `assets/js/app.js`: tải definition động và chạy action từ Web Portal.\n\n## Action đã được JSON runner hỗ trợ\n\nHiện có **9 action executable**. Tất cả thuộc category `core` và được đăng ký tập trung trong `ActionRegistry`.\n\n| `name` | `displayName` đề xuất | `input` | `output` | Source mapping |\n|---|---|---|---|---|\n| `open_app` | Open App | `{\"query\":\"Calendar\"}` | Boolean | `OpenAppAction.doIt()` → `AppTool.openApp()` |\n| `tap` | Tap | `{\"x\":102,\"y\":399}` | Boolean | `TapAction.doIt()` → `QaAccessibilityService.clickAt()` |\n| `home` | Home | `null` | Boolean | `HomeAction.doIt()` → `performNavigation(GLOBAL_ACTION_HOME)` |\n| `back` | Back | `null` | Boolean | `BackAction.doIt()` → `performNavigation(GLOBAL_ACTION_BACK)` |\n| `recents` | Recents | `null` | Boolean | `RecentsAction.doIt()` → `performNavigation(GLOBAL_ACTION_RECENTS)` |\n| `wait` | Wait | `{\"duration\":1000}` | Boolean | `WaitAction.doIt()` → `delay(duration)` |\n| `clear_recents` | Clear Recent Apps | `null` | Clear-recents result | `ClearRecentsAction.doIt()` → `ClearRecentsTool.clear()` |\n| `capture` | Capture Screen | `null` | Image URL hoặc null | `CaptureAction.doIt()` → `takeScreenShotExternal()` |\n| `record` | Record Screen | `{\"duration\":5000}` | Video URL hoặc null | `RecordAction.doIt()` → start/stop record |\n\nID không được define cố định trong danh sách. Mỗi lần JSON được parse, `ActionModel` sinh `id: Int` mới bằng bộ đếm tăng dần, không trùng trong process.\n\nTất cả action gesture chạy trên Android API 24+; đây cũng là `minSdk` của module. App build release không cần debug hoặc root. Các action Accessibility cần service được bật; `capture`/`record` cần phiên Media Projection đã được người dùng chấp thuận.\n\nResponse của `GET /api/qa/steps` không chứa runtime `id`. Mỗi item chứa metadata, `className`, input mặc định, chuỗi kiểu `output` và object `example`. Khi chạy `example`, Gson mới sinh ID runtime.\n\n## Definition: open_app\n\n```json\n{\n  \"name\": \"open_app\",\n  \"displayName\": \"Open App\",\n  \"description\": \"Open an installed Android application by label or package name.\",\n  \"category\": \"core\",\n  \"input\": {\n    \"query\": \"Calendar\"\n  },\n  \"output\": null\n}\n```\n\n### Mapping source\n\n```text\nGson ActionModelJsonAdapter\n  -> OpenAppAction\n  -> doIt(context)\n  -> AppTool.openApp(context, query)\n```\n\n- `AppTool` đến từ module `libs:core`.\n- `query` rỗng: action bị bỏ qua và ghi warning.\n- Sau khi mở app, runner chờ 2.500 ms.\n- Web Portal cũng có endpoint `/api/qa/openapp` để mở app ngoài Script Runner.\n\n## Definition: tap\n\n```json\n{\n  \"name\": \"tap\",\n  \"displayName\": \"Tap\",\n  \"description\": \"Tap an absolute screen coordinate through Accessibility.\",\n  \"category\": \"core\",\n  \"input\": {\n    \"x\": 102,\n    \"y\": 399\n  },\n  \"output\": null\n}\n```\n\n### Mapping source\n\n```text\nGson ActionModelJsonAdapter\n  -> TapAction\n  -> doIt(context)\n  -> QaAccessibilityService.instance\n  -> clickAt(x, y)\n```\n\n- `x`, `y` được đọc từ dynamic `input`.\n- Thiếu tọa độ: nhận mặc định `-1` và action bị bỏ qua.\n- Cần Accessibility service chính active.\n- Runner chờ 1.500 ms.\n- `QaAccessibilityService.clickAt()` là alias tương thích trên `BaseAccessibilityGestureService.tap()`.\n\n## Definitions: home, back, recents\n\n```json\n[\n  {\"name\": \"home\", \"category\": \"core\", \"input\": null, \"output\": null},\n  {\"name\": \"back\", \"category\": \"core\", \"input\": null, \"output\": null},\n  {\"name\": \"recents\", \"category\": \"core\", \"input\": null, \"output\": null}\n]\n```\n\n### Mapping source\n\n```text\nGson ActionModelJsonAdapter\n  -> HomeAction / BackAction / RecentsAction\n  -> doIt(context)\n  -> QaAccessibilityService.instance\n  -> performNavigation(GLOBAL_ACTION_HOME / BACK / RECENTS)\n```\n\n- Không cần `input`.\n- Cần Accessibility service chính active.\n- `output` là `true` khi Android chấp nhận global action, ngược lại là `false`.\n- Runner chờ 500 ms trước action tiếp theo.\n- Có thể chọn, chỉnh JSON và chạy riêng từng action từ Action List trên Web Portal.\n\n## Definition: wait\n\n```json\n{\"name\":\"wait\",\"displayName\":\"Wait\",\"category\":\"core\",\"input\":{\"duration\":1000},\"output\":null}\n```\n\n`WaitAction.doIt()` chờ số millisecond trong `input.duration`, sau đó đặt `output=true`. Definition được trả tự động bởi `GET /api/qa/steps`.\n\n## Definition: clear_recents\n\n```json\n{\"name\":\"clear_recents\",\"displayName\":\"Clear Recent Apps\",\"category\":\"core\",\"input\":null,\"output\":null}\n```\n\n### Mapping source\n\n```text\nGson ActionModelJsonAdapter\n  -> ClearRecentsAction\n  -> doIt(context)\n  -> ClearRecentsTool.clear(context)\n  -> Recents / Accessibility click Clear all\n```\n\n- Mở Recents, cuộn hai hướng và click nhãn Clear/Close/Dismiss all hoặc nhãn tiếng Việt tương ứng.\n- Output là object `success`, `method`, `message`.\n- Action chỉ xóa task trong Recents, không force-stop process nền. `stop_all` không còn được advertise vì hành vi đó cần root, shell, app đặc quyền hoặc device-owner policy.\n\n### Migration từ stop_all\n\nPayload cũ `{\"name\":\"stop_all\"}` không còn là core action executable và không xuất hiện trong `GET /api/qa/steps`. Đổi payload thành `{\"name\":\"clear_recents\"}` nếu mục tiêu là xóa các card/task trên màn hình Recents. Không có payload thay thế nào có thể force-stop mọi app trong điều kiện app release thông thường, không root.\n\n## Definition: capture\n\n```json\n{\n  \"name\": \"capture\",\n  \"displayName\": \"Capture Screen\",\n  \"description\": \"Capture the current screen and save a PNG report.\",\n  \"category\": \"core\",\n  \"input\": null,\n  \"output\": null\n}\n```\n\n### Mapping source\n\n```text\nGson ActionModelJsonAdapter\n  -> CaptureAction\n  -> doIt(context)\n  -> QaAutomationService.takeScreenShotExternal()\n  -> takeScreenShot()\n  -> ScreenCaptureHelper.captureScreen()\n  -> MediaSaveHelper\n```\n\n- Cần QA Automation Service và Media Projection active.\n- Ảnh được lưu trong app reports và `Pictures/QAApp`.\n- `takeScreenShotExternal()` suspend cho đến khi callback capture và lưu reports hoàn tất.\n- `output` thành công là `/qa/reports/QA_Screenshot_<timestamp>.png`; thất bại là null.\n- Web Action List dùng URL cùng origin này để hiển thị preview và link mở ảnh.\n\n## Definition: record\n\n```json\n{\n  \"name\": \"record\",\n  \"displayName\": \"Record Screen\",\n  \"description\": \"Record the screen for a configured duration and save an MP4 report.\",\n  \"category\": \"core\",\n  \"input\": {\n    \"duration\": 5000\n  },\n  \"output\": null\n}\n```\n\n### Mapping source\n\n```text\nGson ActionModelJsonAdapter\n  -> RecordAction\n  -> doIt(context)\n  -> QaAutomationService.startScreenRecordingExternal()\n  -> delay(duration)\n  -> QaAutomationService.stopScreenRecordingExternal()\n  -> ScreenRecordHelper / MediaSaveHelper\n```\n\n- `duration` tính bằng millisecond, mặc định 5.000.\n- Cần QA Automation Service và Media Projection active.\n- Video được lưu trong app reports và `Movies/QAApp`.\n- Action chờ callback start trước khi đếm duration, rồi chờ stop và lưu report hoàn tất.\n- `output` thành công là `/qa/reports/QA_Recording_<timestamp>.mp4`; thất bại là null.\n- Runner chờ thêm 2.000 ms sau khi stop.\n\n## Capability đã có trong source nhưng chưa map vào JSON runner\n\nCác capability sau **đã có method thực thi**, nhưng chưa có concrete `ActionModel` và entry tương ứng trong `ActionRegistry`. Do đó chưa được xem là action executable từ JSON.\n\n| Action name đề xuất | Category | Input đề xuất | Source đã có | Trạng thái |\n|---|---|---|---|---|\n| `swipe` | `core` | `startX`, `startY`, `endX`, `endY`, `duration` | `QaAccessibilityService.swipe()`; `BaseAccessibilityGestureService.swipe()` | Chưa map |\n| `input_text` | `core` | `text` | `QaAccessibilityService.inputText()` | Chưa map |\n| `auto_sequence` | `other` | Cấu hình hiện đang hard-code | `QaAutomationService.executeAutoSequence()` | Chỉ có nút AUTO overlay |\n| `start_record` | `other` | `null` | `startScreenRecordingExternal()` | Chưa map riêng |\n| `stop_record` | `other` | `null` | `stopScreenRecordingExternal()` | Chưa map riêng |\n\n## Vì sao capability chưa phải action?\n\nMột method chỉ được coi là JSON action khi có đủ các phần:\n\n1. Có `name` chính thức.\n2. Có definition cho `input`/`output`.\n3. Có concrete `ActionModel` triển khai `doIt()` và factory được đăng ký trong `ActionRegistry`.\n4. Có validation tại handler.\n5. Có JSON Schema và ví dụ.\n6. Definition được trả qua `GET /api/qa/steps` để Web Portal tự hiển thị.\n\nHiện `swipe`, `input_text` và AUTO mới đáp ứng phần method thực thi, chưa có đầy đủ mapping trên.\n\n## Danh sách payload example dạng JSON\n\nĐây là nội dung `example` dùng để chạy action, vì vậy `output` ban đầu là null và chưa có runtime `id`. Response đầy đủ của `GET /api/qa/steps` còn có `className` và kiểu output; phần lớn là `\"Boolean\"`, `capture` là `\"Image URL\"`, `record` là `\"Video URL\"`, còn `clear_recents` là `\"Clear-recents result\"`. Xem [Cách lấy danh sách step hiện tại](12-lay-danh-sach-step-hien-tai.md).\n\n```json\n[\n  {\n    \"name\": \"open_app\",\n    \"displayName\": \"Open App\",\n    \"description\": \"Open an installed Android application by label or package name.\",\n    \"category\": \"core\",\n    \"input\": {\"query\": \"Calendar\"},\n    \"output\": null\n  },\n  {\n    \"name\": \"tap\",\n    \"displayName\": \"Tap\",\n    \"description\": \"Tap an absolute screen coordinate through Accessibility.\",\n    \"category\": \"core\",\n    \"input\": {\"x\": 102, \"y\": 399},\n    \"output\": null\n  },\n  {\n    \"name\": \"home\",\n    \"displayName\": \"Home\",\n    \"description\": \"Press the Android Home system navigation button.\",\n    \"category\": \"core\",\n    \"input\": null,\n    \"output\": null\n  },\n  {\n    \"name\": \"back\",\n    \"displayName\": \"Back\",\n    \"description\": \"Press the Android Back system navigation button.\",\n    \"category\": \"core\",\n    \"input\": null,\n    \"output\": null\n  },\n  {\n    \"name\": \"recents\",\n    \"displayName\": \"Recents\",\n    \"description\": \"Open the Android recent apps overview.\",\n    \"category\": \"core\",\n    \"input\": null,\n    \"output\": null\n  },\n  {\n    \"name\": \"wait\",\n    \"displayName\": \"Wait\",\n    \"description\": \"Pause script execution for a configured duration.\",\n    \"category\": \"core\",\n    \"input\": {\"duration\": 1000},\n    \"output\": null\n  },\n  {\n    \"name\": \"clear_recents\",\n    \"displayName\": \"Clear Recent Apps\",\n    \"description\": \"Remove all app tasks exposed by the device Recents screen through Accessibility.\",\n    \"category\": \"core\",\n    \"input\": null,\n    \"output\": null\n  },\n  {\n    \"name\": \"capture\",\n    \"displayName\": \"Capture Screen\",\n    \"description\": \"Capture the current display and save a PNG to reports and Gallery.\",\n    \"category\": \"core\",\n    \"input\": null,\n    \"output\": null\n  },\n  {\n    \"name\": \"record\",\n    \"displayName\": \"Record Screen\",\n    \"description\": \"Record the screen for a configured duration and save an MP4 report.\",\n    \"category\": \"core\",\n    \"input\": {\"duration\": 5000},\n    \"output\": null\n  }\n]\n```\n\n## Tổng kết\n\n- Action đã map và chạy được từ JSON: **9**.\n- Capability có sẵn nhưng chưa map: **5**.\n- Category đang dùng: `core`, `other`.\n- Action category `other` đã chạy được từ JSON: **chưa có**.\n",
  "12-lay-danh-sach-step-hien-tai.md": "# Cách lấy danh sách step hiện tại\n\n## Phân biệt hai loại danh sách\n\nTrong appQa, “list step hiện tại” có thể mang hai nghĩa:\n\n1. **Các step đã cấu hình trong một script**: nằm trong field `content` của script record.\n2. **Các loại step mà runner hỗ trợ**: lấy động từ `ActionRegistry`.\n\nBackend có `GET /api/qa/steps` để trả danh sách definition; vẫn chưa expose step đang chạy theo thời gian thực.\n\nEndpoint được đăng ký bởi `QaWebRequestHandler` khi MainActivity cấu hình web server, nên việc đọc definition không cần Media Projection hay QA Automation Service đang chạy.\n\n## Lấy step của một script đã lưu\n\nGọi API lấy Script Library:\n\n```http\nGET http://<device-ip>:8086/api/qa/scripts\n```\n\n```bash\ncurl -fsS http://<device-ip>:8086/api/qa/scripts\n```\n\nResponse là array các script record. Field `content` là một **JSON string**, không phải array trực tiếp:\n\n```json\n[\n  {\n    \"id\": 12,\n    \"name\": \"Calendar smoke test\",\n    \"content\": \"[{\\\"name\\\":\\\"open_app\\\",\\\"input\\\":{\\\"query\\\":\\\"Calendar\\\"}},{\\\"name\\\":\\\"tap\\\",\\\"input\\\":{\\\"x\\\":102,\\\"y\\\":399}}]\",\n    \"runCount\": 4,\n    \"lastRun\": \"2026-08-13T10:30:00Z\",\n    \"lastUpdate\": \"2026-08-13T09:15:00Z\"\n  }\n]\n```\n\nChọn script theo `id`, sau đó parse `content` để nhận `List<ActionModel>`:\n\n```javascript\nconst scripts = await fetch('/api/qa/scripts').then(response => response.json());\nconst script = scripts.find(item => item.id === 12);\nconst steps = script ? JSON.parse(script.content) : [];\n\nconsole.log(steps);\n```\n\nKết quả:\n\n```json\n[\n  {\"name\": \"open_app\", \"input\": {\"query\": \"Calendar\"}},\n  {\"name\": \"tap\", \"input\": {\"x\": 102, \"y\": 399}}\n]\n```\n\nVới `jq`:\n\n```bash\ncurl -fsS http://<device-ip>:8086/api/qa/scripts \\\n  | jq --argjson scriptId 12 \\\n    '.[] | select(.id == $scriptId) | .content | fromjson'\n```\n\nLấy step của tất cả script:\n\n```bash\ncurl -fsS http://<device-ip>:8086/api/qa/scripts \\\n  | jq 'map({id, name, steps: (.content | fromjson)})'\n```\n\n## Lấy step đang mở trong Script Console\n\nWeb Portal giữ JSON của editor trong `editingScript.content`. Danh sách step đang chỉnh sửa được lấy bằng:\n\n```javascript\nconst currentSteps = JSON.parse(editingScript.content || '[]');\n```\n\nTrước khi dùng, Portal gọi `parseAndValidateActions(content)` để xác nhận:\n\n- Root là JSON array.\n- Mỗi phần tử là object.\n- Mỗi step có `name` không rỗng.\n\nNếu script chưa được lưu thì danh sách này chỉ tồn tại trong trạng thái của trang web và chưa xuất hiện trong `GET /api/qa/scripts`.\n\n## Lấy danh sách loại step runner hỗ trợ\n\n```bash\ncurl -fsS http://<device-ip>:8086/api/qa/steps | jq\n```\n\n```javascript\nconst stepDefinitions = await fetch('/api/qa/steps')\n  .then(response => response.json());\n```\n\nMột item trả về có dạng:\n\n```json\n{\n  \"name\": \"wait\",\n  \"displayName\": \"Wait\",\n  \"description\": \"Pause script execution for a configured duration.\",\n  \"category\": \"core\",\n  \"className\": \"WaitAction\",\n  \"input\": {\"duration\": 1000},\n  \"output\": \"Boolean\",\n  \"example\": {\n    \"name\": \"wait\",\n    \"displayName\": \"Wait\",\n    \"description\": \"Pause script execution for a configured duration.\",\n    \"category\": \"core\",\n    \"input\": {\"duration\": 1000},\n    \"output\": null\n  }\n}\n```\n\nDefinition không có `id`; ID Int tăng dần chỉ được sinh khi `example` được parse thành action runtime.\n\nRiêng definition `capture` trả `\"output\": \"Image URL\"`. Sau khi chạy một capture thành công, action runtime chứa URL ảnh có thể xem từ Web Portal:\n\n```json\n{\n  \"name\": \"capture\",\n  \"output\": \"/qa/reports/QA_Screenshot_1760000000000.png\"\n}\n```\n\nDefinition `clear_recents` trả `\"output\": \"Clear-recents result\"`; runtime output có `method: \"accessibility\"`. Action chỉ xóa task trong Recents và không force-stop process nền.\n\nDefinition `record` trả `\"output\": \"Video URL\"`. Khi thành công, runtime output là `/qa/reports/QA_Recording_<timestamp>.mp4`; Web Action List hiển thị video player và link mở file.\n\nRunner hiện map 9 tên action:\n\n| STT | `name` | Input |\n|---:|---|---|\n| 1 | `open_app` | `{\"query\":\"Calendar\"}` |\n| 2 | `tap` | `{\"x\":102,\"y\":399}` |\n| 3 | `home` | `null` |\n| 4 | `back` | `null` |\n| 5 | `recents` | `null` |\n| 6 | `wait` | `{\"duration\":1000}` |\n| 7 | `clear_recents` | `null` |\n| 8 | `capture` | `null` |\n| 9 | `record` | `{\"duration\":5000}` |\n\nSource of truth hiện tại:\n\n- Registry và factory: `model/ActionRegistry.kt`.\n- Concrete execution: `model/CoreActions.kt`.\n- Web tải động từ `GET /api/qa/steps` vào `actionDefinitions`.\n- Mô tả đầy đủ: [Action Definitions](11-action-definitions.md).\n\nKhi thêm core step mới bằng `ActionRegistry.registerCore(...)`, Gson dispatch và Web Action List cùng nhận definition đó; không sửa `app.js`.\n\nVí dụ đăng ký:\n\n```kotlin\nregisterCore(\n    \"wait\", \"Wait\", \"Pause script execution.\",\n    \"WaitAction\", mapOf(\"duration\" to 1000), ::WaitAction\n)\n```\n\n## Có lấy được step đang chạy không?\n\nChưa. Hành vi hiện tại:\n\n- Script có đúng một step: `/api/qa/runscript` chờ `doIt()` hoàn tất và trả action runtime cùng `output`.\n- Script có nhiều step: API trả trạng thái bắt đầu, sau đó runner thực thi trong coroutine nền.\n- Chưa có `runId`, current step index, execution history hoặc endpoint progress.\n\nVì vậy `GET /api/qa/scripts` chỉ trả **cấu hình step đã lưu**, không phản ánh step nào đang được thực thi tại thời điểm gọi.\n"
}
  </script>
  <script>
    const embeddedDocs = JSON.parse(document.querySelector('#embedded-docs').textContent);
    const docs = [
      ['README.md', 'Bắt đầu'],
      ['01-tong-quan.md', 'Tổng quan sản phẩm'],
      ['02-cai-dat-va-khoi-dong.md', 'Cài đặt và khởi động'],
      ['03-accessibility-automation.md', 'Accessibility Automation'],
      ['04-media-va-bao-cao.md', 'Media và báo cáo'],
      ['05-web-portal-va-script.md', 'Web Portal và Script'],
      ['06-kien-truc.md', 'Kiến trúc kỹ thuật'],
      ['07-xu-ly-su-co.md', 'Xử lý sự cố'],
      ['08-script-data-model.md', 'Script data model'],
      ['09-action-data-model.md', 'Action data model'],
      ['10-mo-ta-action.md', 'Mô tả Action'],
      ['11-action-definitions.md', 'Action Definitions'],
      ['12-lay-danh-sach-step-hien-tai.md', 'Lấy danh sách step']
    ];
    const nav = document.querySelector('#nav');
    const content = document.querySelector('#content');
    const path = document.querySelector('#path');
    const prev = document.querySelector('#prev');
    const next = document.querySelector('#next');
    let current = 0;

    const escapeHtml = value => value.replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const inline = value => escapeHtml(value)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, href) => `<a href="${href}"${/^https?:/.test(href) ? ' target="_blank" rel="noreferrer"' : ''}>${label}</a>`);

    function markdown(source) {
      const lines = source.replace(/\r/g, '').split('\n');
      let html = '', paragraph = [], list = null, quote = [], inCode = false, code = [], lang = '';
      const flushParagraph = () => { if (paragraph.length) { html += `<p>${inline(paragraph.join(' '))}</p>`; paragraph = []; } };
      const flushList = () => { if (list) { html += `</${list}>`; list = null; } };
      const flushQuote = () => { if (quote.length) { html += `<blockquote>${inline(quote.join(' '))}</blockquote>`; quote = []; } };
      const tableCells = line => line.trim().replace(/^\||\|$/g, '').split('|').map(cell => cell.trim());
      for (let lineIndex = 0; lineIndex < lines.length; lineIndex++) {
        const line = lines[lineIndex];
        if (line.startsWith('```')) {
          flushParagraph(); flushList(); flushQuote();
          if (inCode) { html += `<pre><code class="language-${escapeHtml(lang)}">${escapeHtml(code.join('\n'))}</code></pre>`; code = []; inCode = false; }
          else { inCode = true; lang = line.slice(3).trim(); }
          continue;
        }
        if (inCode) { code.push(line); continue; }
        const nextLine = lines[lineIndex + 1] || '';
        if (line.trim().startsWith('|') && /^\s*\|?(?:\s*:?-{3,}:?\s*\|)+\s*$/.test(nextLine)) {
          flushParagraph(); flushList(); flushQuote();
          const headers = tableCells(line);
          html += `<table><thead><tr>${headers.map(cell => `<th>${inline(cell)}</th>`).join('')}</tr></thead><tbody>`;
          lineIndex += 2;
          while (lineIndex < lines.length && lines[lineIndex].trim().startsWith('|')) {
            html += `<tr>${tableCells(lines[lineIndex]).map(cell => `<td>${inline(cell)}</td>`).join('')}</tr>`;
            lineIndex++;
          }
          html += '</tbody></table>';
          lineIndex--;
          continue;
        }
        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        const item = line.match(/^\s*([-*]|\d+\.)\s+(.+)$/);
        if (heading) { flushParagraph(); flushList(); flushQuote(); const level = heading[1].length; html += `<h${level}>${inline(heading[2])}</h${level}>`; }
        else if (item) { flushParagraph(); flushQuote(); const type = /\d/.test(item[1]) ? 'ol' : 'ul'; if (list !== type) { flushList(); html += `<${type}>`; list = type; } html += `<li>${inline(item[2])}</li>`; }
        else if (line.startsWith('> ')) { flushParagraph(); flushList(); quote.push(line.slice(2)); }
        else if (!line.trim()) { flushParagraph(); flushList(); flushQuote(); }
        else { flushList(); flushQuote(); paragraph.push(line.trim()); }
      }
      flushParagraph(); flushList(); flushQuote();
      if (inCode) html += `<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`;
      return html;
    }

    function drawNav(filter = '') {
      nav.innerHTML = docs.map(([file, title], index) => title.toLowerCase().includes(filter.toLowerCase())
        ? `<a href="#${file}" data-index="${index}" class="${index === current ? 'active' : ''}">${title}</a>` : '').join('');
    }

    async function load(index, updateHash = true) {
      current = Math.max(0, Math.min(index, docs.length - 1));
      const [file, title] = docs[current];
      content.textContent = 'Đang tải tài liệu…';
      path.textContent = `appQa / docs / ${file}`;
      drawNav(document.querySelector('#search').value);
      prev.disabled = current === 0; next.disabled = current === docs.length - 1;
      prev.textContent = current ? `← ${docs[current - 1][1]}` : '← Trước';
      next.textContent = current < docs.length - 1 ? `${docs[current + 1][1]} →` : 'Tiếp →';
      if (updateHash) {
        try { history.replaceState(null, '', `#${file}`); }
        catch (_) { location.hash = file; }
      }
      try {
        let source = embeddedDocs[file];
        if (location.protocol !== 'file:') {
          const response = await fetch(file, { cache: 'no-cache' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          source = await response.text();
        }
        if (!source) throw new Error(`Missing document: ${file}`);
        content.innerHTML = markdown(source);
        document.title = `${title} · appQa Docs`;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        document.body.classList.remove('menu-open');
      } catch (error) {
        const fallback = embeddedDocs[file];
        content.innerHTML = fallback ? markdown(fallback) : `<div class="error"><strong>Không đọc được ${file}.</strong><small>${escapeHtml(String(error))}</small></div>`;
      }
    }

    nav.addEventListener('click', event => { const link = event.target.closest('[data-index]'); if (link) { event.preventDefault(); load(Number(link.dataset.index)); } });
    content.addEventListener('click', event => { const link = event.target.closest('a'); if (!link) return; const file = link.getAttribute('href'); const index = docs.findIndex(doc => doc[0] === file); if (index >= 0) { event.preventDefault(); load(index); } });
    document.querySelector('#search').addEventListener('input', event => drawNav(event.target.value));
    document.querySelector('#menu').addEventListener('click', () => document.body.classList.toggle('menu-open'));
    function storedTheme() {
      try { return localStorage.getItem('appqa-docs-theme'); }
      catch (_) { return null; }
    }
    document.querySelector('#theme').addEventListener('click', () => {
      const root = document.documentElement;
      const nextTheme = root.dataset.theme === 'dark' ? 'light' : 'dark';
      root.dataset.theme = nextTheme;
      try { localStorage.setItem('appqa-docs-theme', nextTheme); } catch (_) {}
    });
    prev.addEventListener('click', () => load(current - 1)); next.addEventListener('click', () => load(current + 1));
    document.documentElement.dataset.theme = storedTheme() || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    drawNav();
    const initial = docs.findIndex(doc => `#${doc[0]}` === location.hash);
    load(initial >= 0 ? initial : 0, false);
  </script>
